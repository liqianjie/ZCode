name: zcode-auto-update

# ZCode 自动更新流水线（fork 专用，品牌：千寻 qianxun.io）
# 每天 09:30（北京时间）检查上游 zai-org/ZCode，有新提交则：
# 检出上游源码 -> 应用千寻品牌化 -> 构建 -> 发布到本 fork Releases -> 安装到本机 /Applications
# 构建跑在 self-hosted runner（本机，label: zcode-mac），不消耗 GitHub 托管 runner 额度。

on:
  schedule:
    - cron: "30 1 * * *" # 01:30 UTC = 北京时间 09:30
  workflow_dispatch:
    inputs:
      force_build:
        description: "即使 Release 已存在也强制重新构建并发布"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: zcode-auto-update
  cancel-in-progress: false

env:
  ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
  # 品牌产品名（单一来源为 branding/product.json；此处与安装步骤共用同名变量）
  PRODUCT_NAME: 千寻
  LEGACY_APP: ZCode Preview

jobs:
  sync-build-release-install:
    runs-on: [self-hosted, zcode-mac]
    timeout-minutes: 90
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      # 无论是否有新版本，先把上次暂存的新版本换入（仅当应用未运行时）
      - name: 换入暂存的新版本（如应用未运行）
        run: |
          set -euo pipefail
          DEST="/Applications/${PRODUCT_NAME}.app"
          PENDING="/Applications/${PRODUCT_NAME}.pending.app"
          rm -rf "/Applications/${LEGACY_APP}.pending.app"
          if [ ! -d "$PENDING" ]; then
            echo "无暂存版本，跳过"
            exit 0
          fi
          if pgrep -f "${PRODUCT_NAME}.app" >/dev/null 2>&1; then
            echo "应用运行中，暂存版本继续等待"
            exit 0
          fi
          PV=$(defaults read "$PENDING/Contents/Info.plist" CFBundleShortVersionString 2>/dev/null || echo "?")
          rm -rf "$DEST.old"
          if [ -d "$DEST" ]; then mv "$DEST" "$DEST.old"; fi
          cp -R "$PENDING" "$DEST"
          rm -rf "$PENDING"
          xattr -rd com.apple.quarantine "$DEST" 2>/dev/null || true
          echo "已换入暂存版本 v$PV"

      - name: 检查上游是否有新版本
        id: check
        run: |
          set -euo pipefail
          UP_SHA=$(git ls-remote https://github.com/zai-org/ZCode.git refs/heads/main | cut -f1)
          SHORT=$(echo "$UP_SHA" | cut -c1-7)
          echo "up_sha=$UP_SHA"   >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT" >> "$GITHUB_OUTPUT"
          if gh release view "auto-$SHORT" -R liqianjie/ZCode >/dev/null 2>&1; then
            echo "exists=true"  >> "$GITHUB_OUTPUT"
            echo "上游 main = ${SHORT}，对应 Release 已存在"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "上游 main = ${SHORT}，发现新版本"
          fi

      - name: 是否需要构建
        id: decide
        run: |
          FORCE="${{ github.event.inputs.force_build }}"
          if [ "${{ steps.check.outputs.exists }}" = "true" ] && [ "$FORCE" != "true" ]; then
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "已是最新且已发布，本次不构建"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "开始构建（force_build=${FORCE}）"
          fi

      - name: 检出上游源码
        if: steps.decide.outputs.build == 'true'
        uses: actions/checkout@v4
        with:
          repository: zai-org/ZCode
          ref: ${{ steps.check.outputs.up_sha }}

      - name: 检出品牌化配置（本 fork main 的 branding/ 目录）
        if: steps.decide.outputs.build == 'true'
        uses: actions/checkout@v4
        with:
          repository: liqianjie/ZCode
          ref: main
          path: .branding-src
          sparse-checkout: branding

      - name: 应用品牌化
        if: steps.decide.outputs.build == 'true'
        run: |
          set -euo pipefail
          node .branding-src/branding/apply.mjs
          rm -rf .branding-src

      - name: 安装 Node 与 pnpm
        if: steps.decide.outputs.build == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "24.14.0"

      - name: 安装 pnpm
        if: steps.decide.outputs.build == 'true'
        run: npm install -g pnpm@10.33.2

      # 依赖不使用 actions/cache：self-hosted runner 的 pnpm store（~/Library/pnpm/store）
      # 与 electron 缓存本就常驻磁盘、跨任务复用（node_modules 硬链接自 store，几乎零额外占用），
      # 再打包一份缓存反而多占约 8G。

      - name: 安装依赖并打包桌面应用
        if: steps.decide.outputs.build == 'true'
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          # 完整递归构建：bundle:desktop 不会重编 @zcode/ui 等包，
          # 不先 pnpm build 会把工作区里上一次的旧 UI 产物打进安装包。
          pnpm build
          pnpm bundle:desktop

      - name: 发布 Release
        if: steps.decide.outputs.build == 'true'
        run: |
          set -euo pipefail
          SHORT="${{ steps.check.outputs.short_sha }}"
          VER=$(node -p "require('./package.json').version")
          # 把上游提交对象与 tag 推到 fork（不经过 main，不触碰 workflow 文件）
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/liqianjie/ZCode.git" "HEAD:refs/tags/auto-$SHORT"
          cd packages/desktop/dist
          # GitHub 会剥离资产文件名里的非 ASCII 字符，先复制成拉丁名再上传
          cp "./${PRODUCT_NAME}-${VER}-mac-arm64_TEST.zip" "./Qianxun-${VER}-mac-arm64_TEST.zip"
          cp "./${PRODUCT_NAME}-${VER}-mac-arm64_TEST.dmg" "./Qianxun-${VER}-mac-arm64_TEST.dmg"
          if gh release view "auto-$SHORT" -R liqianjie/ZCode >/dev/null 2>&1; then
            gh release upload "auto-$SHORT" -R liqianjie/ZCode \
              "./Qianxun-${VER}-mac-arm64_TEST.zip" \
              "./Qianxun-${VER}-mac-arm64_TEST.dmg" --clobber
          else
            gh release create "auto-$SHORT" -R liqianjie/ZCode \
              --title "${PRODUCT_NAME} v${VER} (${SHORT})" \
              --notes "自动构建 [ci skip]

          - 上游：zai-org/ZCode@${SHORT}（v${VER}），品牌化：千寻（qianxun.io）
          - 变体：Preview / TEST 后端 / 未签名本地构建（mac arm64）
          - zip 内含可直接使用的 .app；dmg 为常规安装镜像" \
              "./Qianxun-${VER}-mac-arm64_TEST.zip" \
              "./Qianxun-${VER}-mac-arm64_TEST.dmg"
          fi
          echo "已发布 Release auto-${SHORT}（${PRODUCT_NAME} v${VER}）"

      - name: 安装到本机
        if: steps.decide.outputs.build == 'true'
        run: |
          set -euo pipefail
          SRC="$GITHUB_WORKSPACE/packages/desktop/dist/mac-arm64/${PRODUCT_NAME}.app"
          DEST="/Applications/${PRODUCT_NAME}.app"
          PENDING="/Applications/${PRODUCT_NAME}.pending.app"
          NEW_VER=$(defaults read "$SRC/Contents/Info.plist" CFBundleShortVersionString)
          if pgrep -f "${PRODUCT_NAME}.app" >/dev/null 2>&1; then
            rm -rf "$PENDING"
            cp -R "$SRC" "$PENDING"
            osascript -e "display notification \"v${NEW_VER} 已就绪，退出并重新打开 ${PRODUCT_NAME} 后生效\" with title \"${PRODUCT_NAME} 自动更新\"" 2>/dev/null || true
            echo "应用运行中：v${NEW_VER} 已暂存到 ${PENDING}，应用退出后自动换入"
          else
            rm -rf "$DEST.old"
            if [ -d "$DEST" ]; then mv "$DEST" "$DEST.old"; fi
            cp -R "$SRC" "$DEST"
            rm -rf "$PENDING"
            xattr -rd com.apple.quarantine "$DEST" 2>/dev/null || true
            GOT=$(defaults read "$DEST/Contents/Info.plist" CFBundleShortVersionString)
            if [ "$GOT" != "$NEW_VER" ]; then
              echo "安装校验失败：期望 v${NEW_VER}，实际 v${GOT}" >&2
              exit 1
            fi
            rm -rf "$DEST.old"
            echo "已安装 ${PRODUCT_NAME} v$GOT 到 $DEST"
          fi
          # 清理旧品牌应用（ZCode Preview）——仅在它未运行时删除
          LEGACY="/Applications/${LEGACY_APP}.app"
          if [ -d "$LEGACY" ]; then
            if pgrep -f "${LEGACY_APP}.app" >/dev/null 2>&1; then
              echo "旧应用 ${LEGACY_APP} 正在运行，暂不删除（下次运行且未运行时自动清理）"
            else
              rm -rf "$LEGACY"
              echo "已删除旧应用 ${LEGACY_APP}"
            fi
          fi

      - name: 清理构建产物（节省磁盘）
        if: always() && steps.decide.outputs.build == 'true'
        run: |
          rm -rf "$GITHUB_WORKSPACE/packages/desktop/dist" "$GITHUB_WORKSPACE/.branding-src"
          echo "已清理 dist 构建产物"

      - name: 汇总
        if: always()
        run: |
          echo "build=${{ steps.decide.outputs.build }} upstream=${{ steps.check.outputs.short_sha }}"
          echo "已安装：$(defaults read "/Applications/${PRODUCT_NAME}.app/Contents/Info.plist" CFBundleShortVersionString 2>/dev/null || echo 无)"
